services:
  db:
    image: postgres:16-alpine
    container_name: call_agent_db
    environment:
      POSTGRES_USER: callagent
      POSTGRES_PASSWORD: callagent
      POSTGRES_DB: callagent
    ports:
      # 5433 on the host so we never collide with a local postgres on 5432
      - "5433:5432"
    volumes:
      - call_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callagent -d callagent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  call_agent_pgdata:
