<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Call Intelligence — SLT Mobitel</title>
    <script>
      // Stamp the theme before first paint. Without this the page renders in the
      // default theme for a frame and flashes when React mounts — which looks
      // broken on a projector. Must match resolveInitialTheme() in src/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("callagent.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
