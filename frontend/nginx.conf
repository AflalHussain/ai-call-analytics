# Serves the built SPA and reverse-proxies the API to the backend service.
# This replaces the Vite dev-server proxy (vite.config.ts) in production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SSE live stream — buffering MUST be off or events arrive in one late batch,
    # and the connection has to stay open far longer than a normal request.
    location /api/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Analytics + ingest — normal proxying. Longest-prefix match means /api/stream
    # above wins for the stream; everything else lands here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /ingest/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — client-side routing / the single index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
